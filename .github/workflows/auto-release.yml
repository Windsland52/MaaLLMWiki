name: Tag catalog snapshot

on:
  push:
    branches:
      - main
    paths:
      - "generated/**"
      - "schemas/**"
      - "sources/**"
  workflow_dispatch:

concurrency:
  group: tag-catalog-snapshot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Check out catalog history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Validate before tagging
        run: |
          uv sync --locked
          uv run maa-wiki-validate
          uv run pytest

      - name: Compute next snapshot version
        id: version
        run: |
          previous="$(git describe --tags --match 'v[0-9]*' --abbrev=0)"
          base="${previous#v}"
          series="${base%.*}"
          next_patch="$(( ${base##*.} + 1 ))"
          while git rev-parse -q --verify "refs/tags/v${series}.${next_patch}" >/dev/null 2>&1; do
            next_patch=$(( next_patch + 1 ))
          done
          echo "previous=${previous}" >> "$GITHUB_OUTPUT"
          echo "version=v${series}.${next_patch}" >> "$GITHUB_OUTPUT"

      - name: Push snapshot tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          {
            echo "Catalog snapshot ${VERSION}"
            echo ""
            echo "Changes since ${PREVIOUS}:"
            git log --oneline --no-decorate "${PREVIOUS}..HEAD"
          } > /tmp/tag-message.txt
          git tag -a "${VERSION}" -F /tmp/tag-message.txt
          git push origin "${VERSION}"

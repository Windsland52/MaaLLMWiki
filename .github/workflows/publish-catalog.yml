name: Publish catalog snapshot

# One workflow owns the whole cycle: detect upstream releases, regenerate the catalogs, commit
# them to the default branch, tag the snapshot, and publish its bundle. Detection, commit, tag,
# and release stay in a single job because events produced with the default GITHUB_TOKEN do not
# start another workflow, which would silently leave a tag without a release.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: publish-catalog
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

env:
  CATALOG_BRANCH: ${{ github.event.repository.default_branch }}
  CATALOG_TOKEN: ${{ secrets.CATALOG_PUSH_TOKEN || github.token }}
  # MaaFramework major line that the catalog tracks. A higher upstream major now makes the sync
  # fail loudly instead of silently freezing the catalog; bump this deliberately when 6.x ships.
  CATALOG_MAJOR: "5"
  HAND_AUTHORED_PATHS: sources/maa-framework/source-map.yaml sources/maa-framework/semantic-changes.yaml

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out catalog history
        uses: actions/checkout@v6
        with:
          ref: ${{ env.CATALOG_BRANCH }}
          fetch-depth: 0
          token: ${{ env.CATALOG_TOKEN }}

      - name: Check out MaaFramework with tags
        uses: actions/checkout@v6
        with:
          repository: MaaXYZ/MaaFramework
          path: tmp/MaaFramework
          fetch-depth: 0
          persist-credentials: false

      - name: Check out Go binding with tags
        uses: actions/checkout@v6
        with:
          repository: MaaXYZ/maa-framework-go
          path: tmp/maa-framework-go
          fetch-depth: 0
          persist-credentials: false

      - name: Check out Rust binding with tags
        uses: actions/checkout@v6
        with:
          repository: MaaXYZ/maa-framework-rs
          path: tmp/maa-framework-rs
          fetch-depth: 0
          persist-credentials: false

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync Maa source indexes
        run: |
          uv sync --locked
          uv run maa-wiki-sync-maafw-history --repository tmp/MaaFramework --major "${CATALOG_MAJOR}"
          uv run maa-wiki-sync-bindings-history \
            --go-repository tmp/maa-framework-go \
            --rust-repository tmp/maa-framework-rs
          uv run maa-wiki-generate-schemas

      - name: Classify catalog state
        id: state
        env:
          GH_TOKEN: ${{ env.CATALOG_TOKEN }}
        run: |
          has_bundle() {
            gh release view "$1" --json assets --jq '.assets[].name' 2>/dev/null \
              | grep -Fx "maa-llm-wiki-catalog-$1.zip" >/dev/null
          }
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            git status --short
            exit 0
          fi
          echo "changed=false" >> "$GITHUB_OUTPUT"
          released="$(git describe --tags --match 'v[0-9]*' --abbrev=0 2>/dev/null || true)"
          if [ -z "${released}" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "::notice::No snapshot tag exists yet; publishing the first snapshot."
          elif ! git diff --quiet "${released}" HEAD -- sources generated schemas; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Catalog paths moved since ${released}; publishing a new snapshot."
          elif [ "$(git rev-parse "${released}^{commit}")" = "$(git rev-parse HEAD)" ] \
            && ! has_bundle "${released}"; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Snapshot ${released} has no release bundle; publishing it again."
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Catalog matches ${released}; no snapshot is needed."
          fi

      - name: Guard hand-authored catalogs
        if: steps.state.outputs.changed == 'true'
        run: |
          if [ -n "$(git status --porcelain -- ${HAND_AUTHORED_PATHS})" ]; then
            echo "::error::Synchronization modified hand-authored catalogs; refusing to publish."
            git status --short -- ${HAND_AUTHORED_PATHS}
            exit 1
          fi

      - name: Validate generated source indexes
        if: steps.state.outputs.publish == 'true'
        run: |
          uv run maa-wiki-validate
          uv run pytest
          uv run ruff check .
          uv run ruff format --check .
          uv run pyright
          git diff --check

      - name: Commit catalog update
        if: steps.state.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git add --all
          unexpected="$(git diff --cached --name-only | grep -Ev '^(sources/|generated/|schemas/)' || true)"
          if [ -n "${unexpected}" ]; then
            echo "::error::Synchronization staged files outside sources/, generated/, schemas/:"
            printf '%s\n' "${unexpected}"
            exit 1
          fi
          git diff --cached --check
          git commit -m "chore: update Maa source indexes"
          git pull --rebase --autostash origin "${CATALOG_BRANCH}"
          git push origin "HEAD:${CATALOG_BRANCH}"

      - name: Compute snapshot version
        if: steps.state.outputs.publish == 'true'
        id: version
        run: |
          existing="$(git describe --exact-match --tags --match 'v[0-9]*' HEAD 2>/dev/null || true)"
          if [ -n "${existing}" ]; then
            version="${existing}"
            previous="$(git describe --tags --match 'v[0-9]*' --abbrev=0 "${existing}^" 2>/dev/null || true)"
            echo "Reusing ${version} from an interrupted publish."
          else
            previous="$(git describe --tags --match 'v[0-9]*' --abbrev=0 2>/dev/null || true)"
            if [ -z "${previous}" ]; then
              version="v0.1.0"
            else
              base="${previous#v}"
              series="${base%.*}"
              next_patch="$(( ${base##*.} + 1 ))"
              while git rev-parse -q --verify "refs/tags/v${series}.${next_patch}" >/dev/null 2>&1; do
                next_patch=$(( next_patch + 1 ))
              done
              version="v${series}.${next_patch}"
            fi
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "previous=${previous}" >> "$GITHUB_OUTPUT"

      - name: Build catalog bundle
        if: steps.state.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          uv run maa-wiki-build-bundle \
            --version "${VERSION}" \
            --output "dist/maa-llm-wiki-catalog-${VERSION}.zip"

      - name: Verify catalog bundle
        if: steps.state.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          uv run maa-wiki-verify-bundle \
            --bundle "dist/maa-llm-wiki-catalog-${VERSION}.zip" \
            --expect-version "${VERSION}" \
            --expect-revision "$(git rev-parse HEAD)"

      - name: Copy stable alias bundle
        if: steps.state.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cp "dist/maa-llm-wiki-catalog-${VERSION}.zip" dist/maa-llm-wiki-catalog-latest.zip
          ls -l dist

      - name: Push snapshot tag
        if: steps.state.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null 2>&1; then
            if [ "$(git rev-parse "${VERSION}^{commit}")" != "$(git rev-parse HEAD)" ]; then
              echo "::error::Tag ${VERSION} already exists at another commit; refusing to reuse it."
              exit 1
            fi
            echo "Tag ${VERSION} already exists at HEAD (interrupted publish); reusing it."
            exit 0
          fi
          {
            echo "Catalog snapshot ${VERSION}"
            echo
            if [ -n "${PREVIOUS}" ]; then
              echo "Changes since ${PREVIOUS}:"
              git log --oneline --no-decorate "${PREVIOUS}..HEAD"
            else
              echo "Initial catalog snapshot."
              git log --oneline --no-decorate
            fi
          } > /tmp/tag-message.txt
          git tag -a "${VERSION}" -F /tmp/tag-message.txt
          git push origin "${VERSION}"

      - name: Publish catalog snapshot
        if: steps.state.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          files: |
            dist/maa-llm-wiki-catalog-${{ steps.version.outputs.version }}.zip
            dist/maa-llm-wiki-catalog-latest.zip
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: true
          token: ${{ env.CATALOG_TOKEN }}

      - name: Reconcile semantic-review issue
        if: always()
        env:
          GH_TOKEN: ${{ env.CATALOG_TOKEN }}
          ISSUE_TITLE: MaaFramework releases awaiting semantic-change review
          ISSUE_LABEL: semantic-review
        run: |
          set -euo pipefail
          if [ ! -d tmp/MaaFramework/.git ]; then
            echo "::warning::MaaFramework clone is unavailable; skipping semantic-review reconciliation."
            exit 0
          fi
          report=/tmp/semantic-gaps.md
          uv run maa-wiki-report-semantic-gaps \
            --repository tmp/MaaFramework \
            --output "${report}"
          gh label create "${ISSUE_LABEL}" --color ededed \
            --description "Releases awaiting semantic-change review" >/dev/null 2>&1 || true
          number="$(gh issue list --state open --label "${ISSUE_LABEL}" --limit 100 \
            --json number --jq '.[0].number // empty')"
          if [ -z "${number}" ]; then
            # Legacy issues created before the label existed are matched by the fixed title.
            number="$(gh issue list --state open --limit 100 --json number,title \
              --template '{{range .}}{{.number}}{{"\t"}}{{.title}}{{"\n"}}{{end}}' \
              | awk -F '\t' -v title="${ISSUE_TITLE}" '$2 == title { print $1; exit }')"
            if [ -n "${number}" ]; then
              gh issue edit "${number}" --add-label "${ISSUE_LABEL}"
            fi
          fi
          if [ ! -s "${report}" ]; then
            echo "No releases are waiting for a semantic-change review."
            if [ -n "${number}" ]; then
              gh issue close "${number}" \
                --comment "The review queue is empty again; closing automatically. The next non-empty report creates or reopens the tracking issue."
            fi
            exit 0
          fi
          new_sha="$(printf '%s' "$(cat "${report}")" | sha256sum | cut -d' ' -f1)"
          if [ -n "${number}" ]; then
            current="$(gh issue view "${number}" --json body --jq .body)"
            current_sha="$(printf '%s' "${current}" | sha256sum | cut -d' ' -f1)"
            if [ "${current_sha}" != "${new_sha}" ]; then
              gh issue edit "${number}" --body-file "${report}"
              gh issue comment "${number}" \
                --body "Review queue changed. The issue body lists the current releases; each item is a suspected trigger, not a verified behaviour change."
            fi
          else
            gh issue create --title "${ISSUE_TITLE}" --label "${ISSUE_LABEL}" --body-file "${report}"
          fi

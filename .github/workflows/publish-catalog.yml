name: Publish catalog snapshot

# One workflow owns the whole cycle: detect upstream releases, regenerate the catalogs, commit
# them to the default branch, tag the snapshot, and publish its bundle. Detection, commit, tag,
# and release stay in a single job because events produced with the default GITHUB_TOKEN do not
# start another workflow, which would silently leave a tag without a release.

on:
  # Twice daily: 03:17 and 15:17 UTC (11:17 and 23:17 UTC+8), plus the manual dispatch below.
  schedule:
    - cron: "17 3,15 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Publish a snapshot even when the catalog data is unchanged (packaging/pipeline change)
        type: boolean
        default: false

concurrency:
  group: publish-catalog
  cancel-in-progress: false

env:
  CATALOG_BRANCH: ${{ github.event.repository.default_branch }}
  CATALOG_TOKEN: ${{ secrets.CATALOG_PUSH_TOKEN || github.token }}
  # MaaFramework major line that the catalog tracks. A higher upstream major now makes the sync
  # fail loudly instead of silently freezing the catalog; bump this deliberately when 6.x ships.
  CATALOG_MAJOR: "5"
  HAND_AUTHORED_PATHS: sources/maa-framework/source-map.yaml sources/maa-framework/semantic-changes.yaml

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Documented legacy exception: this tag predates the publish pipeline and intentionally has no
    # GitHub Release. The final reconciliation step only reports snapshot tags outside this allowlist.
    env:
      LEGACY_UNRELEASED_TAGS: "v0.1.2"
    # Job-level permissions are explicit because this job also mints a short-lived OIDC token and
    # writes a build-provenance attestation record, in addition to pushing the snapshot and
    # reconciling its issue.
    permissions:
      contents: write
      issues: write
      id-token: write
      attestations: write
    steps:
      - name: Check out catalog history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.CATALOG_BRANCH }}
          fetch-depth: 0
          token: ${{ env.CATALOG_TOKEN }}

      - name: Check out MaaFramework with tags
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: MaaXYZ/MaaFramework
          path: tmp/MaaFramework
          fetch-depth: 0
          persist-credentials: false

      - name: Check out Go binding with tags
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: MaaXYZ/maa-framework-go
          path: tmp/maa-framework-go
          fetch-depth: 0
          persist-credentials: false

      - name: Check out Rust binding with tags
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: MaaXYZ/maa-framework-rs
          path: tmp/maa-framework-rs
          fetch-depth: 0
          persist-credentials: false

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.13.7"
          enable-cache: true

      - name: Sync Maa source indexes
        run: |
          uv sync --locked
          uv run maa-wiki-sync-maafw-history --repository tmp/MaaFramework --major "${CATALOG_MAJOR}"
          uv run maa-wiki-sync-bindings-history \
            --go-repository tmp/maa-framework-go \
            --rust-repository tmp/maa-framework-rs
          uv run maa-wiki-generate-schemas

      # The sync above writes the machine-extracted change catalog from the same clone. `--check`
      # re-extracts and compares it with the committed YAML, so a stale catalog (or a sync wiring
      # regression) fails the release before anything is committed, tagged, or published.
      - name: Check machine change catalog is current
        run: |
          uv run maa-wiki-extract-changes --repository tmp/MaaFramework --check

      - name: Failure drill (temporary, reverted immediately)
        # Deliberate failure used once to prove the failure-issue alerting path end to end.
        run: |
          echo "::error::deliberate failure drill"
          exit 1

      - name: Classify catalog state
        id: state
        env:
          GH_TOKEN: ${{ env.CATALOG_TOKEN }}
          # True only for a manual dispatch with force=true; the event-name guard keeps the scheduled
          # path identical to before (inputs is empty there, so the expression is false).
          FORCE_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.force == true }}
        run: |
          has_bundle() {
            gh release view "$1" --json assets --jq '.assets[].name' 2>/dev/null \
              | grep -Fx "maa-llm-wiki-catalog-$1.zip" >/dev/null
          }
          if [ -n "$(git status --porcelain)" ]; then
            if [ "${FORCE_PUBLISH}" = "true" ]; then
              echo "::error::force=true is only for a packaging-only snapshot, but the working tree changed; run the workflow without force so the catalog update is committed and validated normally."
              git status --short
              exit 1
            fi
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            git status --short
            exit 0
          fi
          echo "changed=false" >> "$GITHUB_OUTPUT"
          released="$(git describe --tags --match 'v[0-9]*' --abbrev=0 2>/dev/null || true)"
          if [ -z "${released}" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "::notice::No snapshot tag exists yet; publishing the first snapshot."
          elif ! git diff --quiet "${released}" HEAD -- sources generated schemas; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Catalog paths moved since ${released}; publishing a new snapshot."
          elif [ "$(git rev-parse "${released}^{commit}")" = "$(git rev-parse HEAD)" ] \
            && ! has_bundle "${released}"; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Snapshot ${released} has no release bundle; publishing it again."
          elif [ "${FORCE_PUBLISH}" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Forced packaging-only snapshot: catalog data is unchanged from ${released}; publishing because the packaging/pipeline changed."
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Catalog matches ${released}; no snapshot is needed."
          fi

      - name: Guard hand-authored catalogs
        if: steps.state.outputs.changed == 'true'
        run: |
          if [ -n "$(git status --porcelain -- ${HAND_AUTHORED_PATHS})" ]; then
            echo "::error::Synchronization modified hand-authored catalogs; refusing to publish."
            git status --short -- ${HAND_AUTHORED_PATHS}
            exit 1
          fi

      - name: Validate generated source indexes
        if: steps.state.outputs.publish == 'true'
        run: |
          uv run maa-wiki-validate
          uv run pytest
          uv run ruff check .
          uv run ruff format --check .
          uv run pyright
          git diff --check

      - name: Commit catalog update
        if: steps.state.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git add --all
          unexpected="$(git diff --cached --name-only | grep -Ev '^(sources/|generated/|schemas/)' || true)"
          if [ -n "${unexpected}" ]; then
            echo "::error::Synchronization staged files outside sources/, generated/, schemas/:"
            printf '%s\n' "${unexpected}"
            exit 1
          fi
          git diff --cached --check
          git commit -m "chore: update Maa source indexes"
          git pull --rebase --autostash origin "${CATALOG_BRANCH}"
          git push origin "HEAD:${CATALOG_BRANCH}"

      - name: Compute snapshot version
        if: steps.state.outputs.publish == 'true'
        id: version
        run: |
          existing="$(git describe --exact-match --tags --match 'v[0-9]*' HEAD 2>/dev/null || true)"
          if [ -n "${existing}" ]; then
            version="${existing}"
            previous="$(git describe --tags --match 'v[0-9]*' --abbrev=0 "${existing}^" 2>/dev/null || true)"
            echo "Reusing ${version} from an interrupted publish."
          else
            previous="$(git describe --tags --match 'v[0-9]*' --abbrev=0 2>/dev/null || true)"
            if [ -z "${previous}" ]; then
              version="v0.1.0"
            else
              base="${previous#v}"
              series="${base%.*}"
              next_patch="$(( ${base##*.} + 1 ))"
              while git rev-parse -q --verify "refs/tags/v${series}.${next_patch}" >/dev/null 2>&1; do
                next_patch=$(( next_patch + 1 ))
              done
              version="v${series}.${next_patch}"
            fi
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "previous=${previous}" >> "$GITHUB_OUTPUT"

      - name: Build catalog bundle
        if: steps.state.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          uv run maa-wiki-build-bundle \
            --version "${VERSION}" \
            --output "dist/maa-llm-wiki-catalog-${VERSION}.zip"

      - name: Verify catalog bundle
        if: steps.state.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          uv run maa-wiki-verify-bundle \
            --bundle "dist/maa-llm-wiki-catalog-${VERSION}.zip" \
            --expect-version "${VERSION}" \
            --expect-revision "$(git rev-parse HEAD)"

      - name: Copy stable alias bundle
        if: steps.state.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cp "dist/maa-llm-wiki-catalog-${VERSION}.zip" dist/maa-llm-wiki-catalog-latest.zip
          ls -l dist

      # The alias is a byte-identical copy, so one checksum file covers both download names. Generate
      # it from inside dist/ so `sha256sum -c SHA256SUMS` works in the directory a consumer downloaded
      # the assets to. Argument order fixes the line order; the versioned bundle is listed first.
      - name: Write checksums
        if: steps.state.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          (
            cd dist
            sha256sum \
              "maa-llm-wiki-catalog-${VERSION}.zip" \
              maa-llm-wiki-catalog-latest.zip \
              > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
          cat dist/SHA256SUMS

      # The standalone verifier ships as a release asset so a consumer can check a bundle with only a
      # Python 3 interpreter (no uv, no checkout). Copy it verbatim from the repository and run it
      # against the freshly built bundle as an extra gate before the tag is pushed. It is NOT attested:
      # the versioned zip remains the only attested subject.
      - name: Package and run standalone verifier
        if: steps.state.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cp src/maa_llm_wiki/verify_bundle.py dist/verify_bundle.py
          # Prefer `python`; fall back to `python3` if the runner image has no `python` alias.
          PYTHON_BIN=python
          command -v "${PYTHON_BIN}" >/dev/null 2>&1 || PYTHON_BIN=python3
          "${PYTHON_BIN}" dist/verify_bundle.py \
            --bundle "dist/maa-llm-wiki-catalog-${VERSION}.zip" \
            --expect-version "${VERSION}" \
            --expect-revision "$(git rev-parse HEAD)" \
            --checksums dist/SHA256SUMS

      # The release body is generated from the catalog so a consumer can see, without cloning, which
      # upstream versions this snapshot pins, what moved since the previous snapshot, the extracted
      # facts, the exact verification commands and the asset digests. It is rendered before the
      # attestation/tag/release so a failed render never leaves a tag without its intended body.
      - name: Generate release notes
        if: steps.state.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          set -euo pipefail
          args=(
            uv run maa-wiki-release-notes
            --root .
            --version "${VERSION}"
            --bundle "dist/maa-llm-wiki-catalog-${VERSION}.zip"
            --output dist/release-notes.md
          )
          # The first snapshot has no previous tag; omit the flag rather than passing an empty value.
          if [ -n "${PREVIOUS}" ]; then
            args+=(--previous "${PREVIOUS}")
          fi
          "${args[@]}"

      # Order: build -> verify -> copy stable alias -> checksum -> standalone verifier -> release
      # notes -> attest -> tag -> release. The attestation only needs the versioned zip to exist, so
      # creating it before the tag/release means a failed attestation cannot leave a tagged snapshot
      # without provenance. Only the immutable versioned zip is attested; the `-latest` alias,
      # SHA256SUMS and verify_bundle.py are convenience artifacts.
      # v4.2.2 is the newest attest-build-provenance tag; it delegates to actions/attest v4.2.1,
      # which runs on Node 24. The Node 20 deprecation warning came from v2.4.0's bundled `predicate`
      # action, so this pin removes that warning; re-pin by SHA when a newer tag ships.
      - name: Attest build provenance
        if: steps.state.outputs.publish == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/maa-llm-wiki-catalog-${{ steps.version.outputs.version }}.zip

      - name: Push snapshot tag
        if: steps.state.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null 2>&1; then
            if [ "$(git rev-parse "${VERSION}^{commit}")" != "$(git rev-parse HEAD)" ]; then
              echo "::error::Tag ${VERSION} already exists at another commit; refusing to reuse it."
              exit 1
            fi
            echo "Tag ${VERSION} already exists at HEAD (interrupted publish); reusing it."
            exit 0
          fi
          {
            echo "Catalog snapshot ${VERSION}"
            echo
            if [ -n "${PREVIOUS}" ]; then
              echo "Changes since ${PREVIOUS}:"
              git log --oneline --no-decorate "${PREVIOUS}..HEAD"
            else
              echo "Initial catalog snapshot."
              git log --oneline --no-decorate
            fi
          } > /tmp/tag-message.txt
          git tag -a "${VERSION}" -F /tmp/tag-message.txt
          git push origin "${VERSION}"

      - name: Publish catalog snapshot
        if: steps.state.outputs.publish == 'true'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ steps.version.outputs.version }}
          files: |
            dist/maa-llm-wiki-catalog-${{ steps.version.outputs.version }}.zip
            dist/maa-llm-wiki-catalog-latest.zip
            dist/SHA256SUMS
            dist/verify_bundle.py
          # The generated body is the release body; do not also let the action generate notes.
          body_path: dist/release-notes.md
          overwrite_files: true
          fail_on_unmatched_files: true
          token: ${{ env.CATALOG_TOKEN }}

      - name: Reconcile semantic-review issue
        if: always()
        env:
          GH_TOKEN: ${{ env.CATALOG_TOKEN }}
          ISSUE_TITLE: MaaFramework releases awaiting semantic-change review
          ISSUE_LABEL: semantic-review
        run: |
          set -euo pipefail
          if [ ! -d tmp/MaaFramework/.git ]; then
            echo "::warning::MaaFramework clone is unavailable; skipping semantic-review reconciliation."
            exit 0
          fi
          report=/tmp/semantic-gaps.md
          body=/tmp/semantic-gaps-body.md
          uv run maa-wiki-report-semantic-gaps \
            --repository tmp/MaaFramework \
            --output "${report}"
          # The report's closing paragraph asks for a curated semantic-changes.yaml entry. That is
          # optional now that machine-extracted facts are published automatically, so drop the old
          # instruction (everything from that paragraph to EOF) and append the current framing. The
          # create/update/close lifecycle below is unchanged.
          sed '/^Review each release against its pinned commit/,$d' "${report}" > /tmp/semantic-gaps-lead.md
          {
            cat /tmp/semantic-gaps-lead.md
            echo
            echo "Machine-extracted change facts for these releases are published automatically in"
            echo "\`generated/maa-framework/machine-changes.md\` and in the bundle; detection is not a"
            echo "manual step. A curated \`semantic-changes.yaml\` entry is **optional**: it adds"
            echo "interpretation (why a change matters for routing), not detection."
            echo
            echo "Opened by \`.github/workflows/publish-catalog.yml\`."
          } > "${body}"
          gh label create "${ISSUE_LABEL}" --color ededed \
            --description "Releases awaiting semantic-change review" >/dev/null 2>&1 || true
          number="$(gh issue list --state open --label "${ISSUE_LABEL}" --limit 100 \
            --json number --jq '.[0].number // empty')"
          if [ -z "${number}" ]; then
            # Legacy issues created before the label existed are matched by the fixed title.
            number="$(gh issue list --state open --limit 100 --json number,title \
              --template '{{range .}}{{.number}}{{"\t"}}{{.title}}{{"\n"}}{{end}}' \
              | awk -F '\t' -v title="${ISSUE_TITLE}" '$2 == title { print $1; exit }')"
            if [ -n "${number}" ]; then
              gh issue edit "${number}" --add-label "${ISSUE_LABEL}"
            fi
          fi
          if [ ! -s "${report}" ]; then
            echo "No releases are waiting for a semantic-change review."
            if [ -n "${number}" ]; then
              gh issue close "${number}" \
                --comment "The change-review queue is empty again; closing automatically. Machine facts continue to be published in generated/maa-framework/machine-changes.md; the next non-empty report reopens or creates this tracking issue."
            fi
            exit 0
          fi
          new_sha="$(printf '%s' "$(cat "${body}")" | sha256sum | cut -d' ' -f1)"
          if [ -n "${number}" ]; then
            current="$(gh issue view "${number}" --json body --jq .body)"
            current_sha="$(printf '%s' "${current}" | sha256sum | cut -d' ' -f1)"
            if [ "${current_sha}" != "${new_sha}" ]; then
              gh issue edit "${number}" --body-file "${body}"
              gh issue comment "${number}" \
                --body "Change queue updated. Machine-extracted facts are published automatically in generated/maa-framework/machine-changes.md; a curated narrative entry is optional (it adds interpretation, not detection)."
            fi
          else
            gh issue create --title "${ISSUE_TITLE}" --label "${ISSUE_LABEL}" --body-file "${body}"
          fi

      # Informational only: every snapshot tag should have a release, and every release should carry
      # its catalog asset. LEGACY_UNRELEASED_TAGS is the documented allowlist (v0.1.2 predates the
      # pipeline and intentionally has no release). This step never fails the job and stays completely
      # silent on a healthy repository; unexpected findings are surfaced as ::warning:: annotations
      # plus a job-summary entry, so nothing is hidden and nothing is deleted or fabricated.
      - name: Reconcile snapshot tags with releases
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ env.CATALOG_TOKEN }}
        run: |
          set -uo pipefail
          unexpected=0
          notes=()
          releases="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | [.tag_name, (.assets | map(.name) | join(","))] | @tsv' 2>/dev/null || true)"
          if [ -z "${releases}" ]; then
            echo "::warning::Could not list GitHub Releases while reconciling snapshot tags; skipping."
            exit 0
          fi
          has_release() { printf '%s\n' "${releases}" | cut -f1 | grep -Fxq "$1"; }
          release_assets() {
            printf '%s\n' "${releases}" | awk -F '\t' -v tag="$1" '$1 == tag { print $2; exit }'
          }
          while IFS= read -r tag; do
            [ -n "${tag}" ] || continue
            if ! has_release "${tag}"; then
              case " ${LEGACY_UNRELEASED_TAGS} " in
                (*" ${tag} "*) continue ;;
              esac
              echo "::warning::Snapshot tag ${tag} has no GitHub Release (and is not in LEGACY_UNRELEASED_TAGS)."
              notes+=("- tag \`${tag}\` has no GitHub Release")
              unexpected=1
              continue
            fi
            assets="$(release_assets "${tag}")"
            expected="maa-llm-wiki-catalog-${tag}.zip"
            if ! printf '%s\n' "${assets}" | tr ',' '\n' | grep -Fxq "${expected}"; then
              echo "::warning::Release ${tag} has no catalog asset ${expected}."
              notes+=("- release \`${tag}\` has no catalog asset \`${expected}\`")
              unexpected=1
            fi
          done < <(git tag -l 'v[0-9]*' --sort=version:refname)
          if [ "${unexpected}" -eq 1 ]; then
            {
              echo "### Snapshot tag / release reconciliation"
              echo
              echo "Unexpected mismatches were found; nothing was modified:"
              printf '%s\n' "${notes[@]}"
              echo
              echo "Tags and releases are only created by a publish run, so resolve these manually."
              echo "v0.1.2 is the documented legacy exception (CATALOG-CONTRACT.md section 7.4)."
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
          exit 0

      - name: Report pipeline failure
        # Alert channel: a scheduled run that fails is easy to miss in the Actions list, so open (or
        # update) a labelled issue instead. It closes automatically on the next successful run.
        # The body names the failed steps and repeats the deliberate-guard guidance, because most
        # failures here are guards asking for a decision, not broken code.
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ env.CATALOG_TOKEN }}
          ISSUE_LABEL: pipeline-failure
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          gh label create "${ISSUE_LABEL}" --color B60205 \
            --description "Publish catalog pipeline failed" >/dev/null 2>&1 || true
          failed="$(gh run view "${GITHUB_RUN_ID}" --json jobs \
            --jq '[.jobs[].steps[] | select(.conclusion == "failure") | .name] | join(", ")' \
            2>/dev/null || true)"
          [ -n "${failed}" ] || failed="unknown (see the run log)"
          body="$(mktemp)"
          {
            echo "The publish workflow failed. This issue closes automatically on the next successful run."
            echo
            echo "- Run: ${RUN_URL}"
            echo "- Revision: \`${GITHUB_SHA}\`"
            echo "- Failed steps: ${failed}"
            echo
            echo "Deliberate guards fail the same way and need a decision, not a code fix:"
            echo
            echo "- \`Sync Maa source indexes\` fails when upstream publishes a higher major version (raise \`CATALOG_MAJOR\` in the workflow) or when the upstream tag list shrank (confirm the tags really went away; the registry is only rewritten with the explicit \`--prune\` flag)."
            echo "- \`Check machine change catalog is current\` fails when the committed machine catalog no longer matches a fresh extraction of the upstream diffs."
            echo "- \`Guard hand-authored catalogs\` fails when the synchronization wrote one of the curated catalogs; that is a defect, not a data update."
            echo "- \`Validate generated source indexes\` fails when code or data is inconsistent; the step log names the failing check."
            echo
            echo "After fixing, re-run the workflow from the Actions page (or wait for the next schedule)."
          } > "${body}"
          number="$(gh issue list --state open --label "${ISSUE_LABEL}" --limit 1 \
            --json number --jq '.[0].number // empty')"
          new_sha="$(printf '%s' "$(cat "${body}")" | sha256sum | cut -d' ' -f1)"
          if [ -n "${number}" ]; then
            current="$(gh issue view "${number}" --json body --jq .body)"
            current_sha="$(printf '%s' "${current}" | sha256sum | cut -d' ' -f1)"
            if [ "${current_sha}" != "${new_sha}" ]; then
              gh issue edit "${number}" --body-file "${body}"
              gh issue comment "${number}" \
                --body "The pipeline failed again and the details changed; the issue body lists the current failure."
            fi
          else
            gh issue create --title "Publish catalog pipeline failed" \
              --label "${ISSUE_LABEL}" --body-file "${body}"
          fi

      - name: Close pipeline failure issue
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ env.CATALOG_TOKEN }}
          ISSUE_LABEL: pipeline-failure
        run: |
          set -uo pipefail
          number="$(gh issue list --state open --label "${ISSUE_LABEL}" --limit 1 \
            --json number --jq '.[0].number // empty')"
          if [ -n "${number}" ]; then
            gh issue close "${number}" \
              --comment "The publish workflow succeeded again; closing automatically."
          fi

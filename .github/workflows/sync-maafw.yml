name: Sync Maa source indexes

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out MaaLLMWiki
        uses: actions/checkout@v6

      - name: Check out MaaFramework with tags
        uses: actions/checkout@v6
        with:
          repository: MaaXYZ/MaaFramework
          path: tmp/MaaFramework
          fetch-depth: 0

      - name: Check out Go binding with tags
        uses: actions/checkout@v6
        with:
          repository: MaaXYZ/maa-framework-go
          path: tmp/maa-framework-go
          fetch-depth: 0

      - name: Check out Rust binding with tags
        uses: actions/checkout@v6
        with:
          repository: MaaXYZ/maa-framework-rs
          path: tmp/maa-framework-rs
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync stable Maa source releases
        run: |
          uv sync --locked
          uv run maa-wiki-sync-maafw-history --repository tmp/MaaFramework --major 5
          uv run maa-wiki-sync-bindings-history --go-repository tmp/maa-framework-go --rust-repository tmp/maa-framework-rs
          uv run maa-wiki-generate-schemas

      - name: Validate generated source indexes
        run: |
          uv run maa-wiki-validate
          uv run pytest
          uv run ruff check .
          uv run ruff format --check .
          uv run pyright
          git diff --check

      - name: Open update pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/update-maa-sources
          delete-branch: true
          commit-message: "chore: update Maa source indexes"
          title: "chore: update Maa source indexes"
          body: |
            Automated stable-release inventory update for MaaFramework and its Go/Rust bindings.

            Review required:
            - inspect documentation, schema, native API, and binding API changes;
            - inspect independently versioned Go/Rust binding API and compatibility changes;
            - add semantic-change records when runtime behavior changed;
            - confirm compatibility before merging.
